<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sacred Mahamantra Sanctuary</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cormorant Garamond for sacred numerals & Cinzel for inscriptions -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#080706',
            charcoal: '#0e0d0c',
            earth: '#241d17',
            stone: '#181411',
            gold: {
              light: '#e8d3a7',
              DEFAULT: '#c8a96e',
              antique: '#9e7e46',
              dim: '#594728'
            },
            saffron: {
              glow: '#d97c43',
              DEFAULT: '#c46d3b',
              deep: '#783b19'
            },
            ivory: '#f4ece1'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            inscription: ['"Cinzel"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #050404;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      color: #e8d3a7;
    }

    /* Ambient Temple Diya Underglow & Stone Sanctuary Background */
    .sanctuary-bg {
      background: 
        radial-gradient(circle at 50% 50%, rgba(196, 109, 59, 0.16) 0%, rgba(200, 169, 110, 0.08) 38%, rgba(24, 20, 17, 0.75) 68%, #080706 100%),
        radial-gradient(circle at 50% 20%, rgba(200, 169, 110, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(217, 124, 67, 0.07) 0%, transparent 50%),
        linear-gradient(180deg, #090807 0%, #120f0c 50%, #070605 100%);
    }

    /* Central Altar Medallion Materiality (Carved Dark Stone + Antique Brass Rim) */
    .altar-circle {
      background: 
        radial-gradient(circle at 50% 38%, rgba(46, 36, 28, 0.94) 0%, rgba(19, 16, 14, 0.98) 65%, #0b0908 100%);
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.95),
        0 0 55px 2px rgba(196, 109, 59, 0.14),
        inset 0 1px 2px rgba(232, 211, 167, 0.28),
        inset 0 -12px 28px rgba(8, 7, 6, 0.92),
        inset 0 0 35px rgba(200, 169, 110, 0.1);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .altar-circle:hover {
      box-shadow: 
        0 28px 70px -12px rgba(0, 0, 0, 0.98),
        0 0 65px 8px rgba(217, 124, 67, 0.22),
        inset 0 1px 3px rgba(232, 211, 167, 0.35),
        inset 0 -12px 28px rgba(8, 7, 6, 0.9),
        inset 0 0 42px rgba(200, 169, 110, 0.14);
    }

    .altar-circle.pressed {
      transform: scale(0.965);
      box-shadow: 
        0 14px 35px -8px rgba(0, 0, 0, 0.98),
        0 0 75px 14px rgba(217, 124, 67, 0.32),
        inset 0 1px 4px rgba(232, 211, 167, 0.45),
        inset 0 -8px 20px rgba(8, 7, 6, 0.88),
        inset 0 0 50px rgba(196, 109, 59, 0.25);
    }

    /* Diya Flame Breathing Animation */
    @keyframes diyaBreathe {
      0%, 100% {
        opacity: 0.65;
        transform: scale(1);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.04);
      }
    }

    .diya-ambient {
      animation: diyaBreathe 6.5s ease-in-out infinite;
    }

    /* Slow rotation for background sacred yantra */
    @keyframes slowMandala {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .sacred-rotation {
      animation: slowMandala 280s linear infinite;
    }

    /* Sacred Numeral Glow */
    .numeral-glow {
      text-shadow: 
        0 0 32px rgba(217, 124, 67, 0.42),
        0 0 10px rgba(232, 211, 167, 0.25),
        0 2px 12px rgba(0, 0, 0, 0.95);
      font-feature-settings: "lnum" 1, "tnum" 1;
    }

    /* Expanding Ripple Effect on Tap */
    @keyframes sacredRipple {
      0% {
        transform: translate(-50%, -50%) scale(0.88);
        opacity: 0.65;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.42);
        opacity: 0;
      }
    }

    .ripple-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      border: 1px solid rgba(200, 169, 110, 0.55);
      box-shadow: 0 0 30px rgba(196, 109, 59, 0.35);
      pointer-events: none;
      animation: sacredRipple 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Subtle Mantra stanza illumination states */
    .mantra-card {
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mantra-illuminated {
      color: #f4ece1;
      text-shadow: 
        0 0 22px rgba(217, 124, 67, 0.55),
        0 0 8px rgba(232, 211, 167, 0.3);
      opacity: 0.98;
      background: radial-gradient(ellipse at 50% 50%, rgba(196, 109, 59, 0.18) 0%, rgba(200, 169, 110, 0.05) 65%, transparent 100%);
      border-color: rgba(200, 169, 110, 0.35);
      box-shadow: 0 0 30px rgba(196, 109, 59, 0.12);
    }

    .mantra-dimmed {
      color: #c8a96e;
      text-shadow: 0 0 10px rgba(200, 169, 110, 0.12);
      opacity: 0.65;
      background: rgba(14, 13, 12, 0.35);
      border-color: rgba(200, 169, 110, 0.15);
    }

    /* Pulse when a mantra stanza is actively tapped or incremented */
    @keyframes stanzaPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.018); }
      100% { transform: scale(1); }
    }

    .stanza-pulse {
      animation: stanzaPulse 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Responsive scaling for compact screens */
    @media (max-height: 700px) {
      .altar-circle {
        width: 215px !important;
        height: 215px !important;
      }
      #mala-ring-svg {
        width: 260px !important;
        height: 260px !important;
      }
      #diya-halo {
        width: 275px !important;
        height: 275px !important;
      }
      #ripple-container {
        width: 215px !important;
        height: 215px !important;
      }
      #bead-count {
        font-size: 64px !important;
      }
    }

    @media (max-height: 560px) {
      .altar-circle {
        width: 175px !important;
        height: 175px !important;
      }
      #mala-ring-svg {
        width: 215px !important;
        height: 215px !important;
      }
      #diya-halo {
        width: 225px !important;
        height: 225px !important;
      }
      #ripple-container {
        width: 175px !important;
        height: 175px !important;
      }
      #bead-count {
        font-size: 52px !important;
      }
    }
  </style>
</head>

<body class="w-screen h-screen h-[100dvh] overflow-hidden m-0 p-0 bg-[#050404]">

  <!-- Edge-to-Edge Full Screen Sanctuary Container -->
  <main
    id="sanctuary-app"
    class="relative w-screen h-screen h-[100dvh] sanctuary-bg overflow-hidden flex flex-col justify-between items-center px-4 sm:px-6 md:px-8 py-3 sm:py-5 select-none"
  >

    <!-- 1. Procedural Stone Grain Filter Overlay -->
    <svg class="pointer-events-none absolute inset-0 w-full h-full opacity-[0.04] z-0" aria-hidden="true">
      <filter id="stone-paper-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0 0.75 0 0  0 0 0 0.65 0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#stone-paper-grain)" />
    </svg>

    <!-- 2. Sacred Concentric Lotus Yantra Watermark -->
    <div class="pointer-events-none absolute inset-0 flex items-center justify-center opacity-[0.035] z-0 overflow-hidden" aria-hidden="true">
      <svg class="w-[720px] h-[720px] sacred-rotation" viewBox="0 0 400 400" fill="none" stroke="#c8a96e" stroke-width="0.6">
        <circle cx="200" cy="200" r="190" stroke-dasharray="2 4" />
        <circle cx="200" cy="200" r="165" />
        <circle cx="200" cy="200" r="138" />
        <circle cx="200" cy="200" r="96" />
        <g>
          <path d="M200 10 C215 45 215 65 200 104 C185 65 185 45 200 10 Z" />
          <path d="M200 390 C215 355 215 335 200 296 C185 335 185 355 200 390 Z" />
          <path d="M10 200 C45 215 65 215 104 200 C65 185 45 185 10 200 Z" />
          <path d="M390 200 C355 215 335 215 296 200 C335 185 355 185 390 200 Z" />
          <g transform="rotate(45 200 200)">
            <path d="M200 10 C215 45 215 65 200 104 C185 65 185 45 200 10 Z" />
            <path d="M200 390 C215 355 215 335 200 296 C185 335 185 355 200 390 Z" />
            <path d="M10 200 C45 215 65 215 104 200 C65 185 45 185 10 200 Z" />
            <path d="M390 200 C355 215 335 215 296 200 C335 185 355 185 390 200 Z" />
          </g>
          <g transform="rotate(22.5 200 200)">
            <path d="M200 35 C210 62 210 78 200 104 C190 78 190 62 200 35 Z" />
            <path d="M200 365 C210 338 210 322 200 296 C190 322 190 338 200 365 Z" />
            <path d="M35 200 C62 210 78 210 104 200 C78 190 62 190 35 200 Z" />
            <path d="M365 200 C338 210 322 210 296 200 C322 190 338 190 365 200 Z" />
          </g>
          <g transform="rotate(67.5 200 200)">
            <path d="M200 35 C210 62 210 78 200 104 C190 78 190 62 200 35 Z" />
            <path d="M200 365 C210 338 210 322 200 296 C190 322 190 338 200 365 Z" />
            <path d="M35 200 C62 210 78 210 104 200 C78 190 62 190 35 200 Z" />
            <path d="M365 200 C338 210 322 210 296 200 C322 190 338 190 365 200 Z" />
          </g>
        </g>
        <rect x="92" y="92" width="216" height="216" />
        <rect x="92" y="92" width="216" height="216" transform="rotate(45 200 200)" />
      </svg>
    </div>

    <!-- 3. Interactive Floating Diya Spark Particles Canvas -->
    <canvas id="particle-canvas" class="pointer-events-none absolute inset-0 w-full h-full z-20"></canvas>

    <!-- Floating Quick Actions (Top Right) -->
    <div class="absolute top-3 right-3 sm:top-5 sm:right-6 z-30 flex items-center space-x-2">
      <!-- Sound Toggle -->
      <button
        id="sound-toggle"
        type="button"
        aria-label="Toggle sacred Tulsi bead acoustics"
        title="Toggle sound"
        class="flex items-center space-x-1.5 py-1.5 px-3 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/80 backdrop-blur-md text-[#c8a96e]/80 hover:text-[#e8d3a7] shadow-[0_4px_16px_rgba(0,0,0,0.5)] transition-all focus:outline-none cursor-pointer"
      >
        <div class="relative w-4 h-4 flex items-center justify-center">
          <svg id="sound-icon-on" class="w-4 h-4 text-[#e8d3a7]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="2.5" fill="currentColor" />
            <path d="M7.5 7.5 C5 10 5 14 7.5 16.5" stroke-linecap="round" />
            <path d="M16.5 7.5 C19 10 19 14 16.5 16.5" stroke-linecap="round" />
          </svg>
          <svg id="sound-icon-off" class="w-4 h-4 text-[#c8a96e]/40 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="2" />
            <path d="M5 19 L19 5" stroke-linecap="round" />
          </svg>
        </div>
      </button>

      <!-- Clean Reset Button -->
      <button
        id="reset-btn"
        type="button"
        aria-label="Reset counter"
        title="Click to reset bead counter"
        class="group flex items-center space-x-1.5 py-1.5 px-3 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/80 backdrop-blur-md text-[#c8a96e]/80 hover:text-[#e8d3a7] shadow-[0_4px_16px_rgba(0,0,0,0.5)] transition-all focus:outline-none cursor-pointer"
      >
        <svg class="w-4 h-4 text-[#e8d3a7] group-hover:-rotate-90 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 3v5h5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="font-inscription uppercase tracking-[0.2em] text-[9px] sm:text-[10px]">
          Reset
        </span>
      </button>

      <!-- Fullscreen Immersion Button -->
      <button
        id="fullscreen-toggle"
        type="button"
        aria-label="Toggle fullscreen meditation mode"
        title="Toggle Fullscreen"
        class="flex items-center space-x-1.5 py-1.5 px-3 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/80 backdrop-blur-md text-[#c8a96e]/80 hover:text-[#e8d3a7] shadow-[0_4px_16px_rgba(0,0,0,0.5)] transition-all focus:outline-none cursor-pointer"
      >
        <svg id="fullscreen-icon-enter" class="w-4 h-4 text-[#e8d3a7]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="fullscreen-icon-exit" class="w-4 h-4 text-[#e8d3a7] hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- 4. MAIN SACRED STAGE: 
         TOP: Pancha-Tattva Mantra
         MIDDLE: Sacred Counter Altar
         BOTTOM: Hare Krishna Mahamantra
    -->
    <div class="relative z-10 w-full max-w-3xl flex-1 flex flex-col justify-between items-center my-auto py-2 sm:py-4">

      <!-- TOP: PANCHA-TATTVA MANTRA -->
      <div class="w-full flex flex-col items-center text-center pt-1 sm:pt-2">
        <button
          id="pancha-tattva-box"
          type="button"
          aria-label="Illuminate Pancha-Tattva Maha-Mantra"
          class="mantra-card mantra-illuminated group relative w-full max-w-2xl rounded-2xl px-5 py-3 sm:px-7 sm:py-4 text-center focus:outline-none cursor-pointer border border-[#c8a96e]/25 hover:border-[#c8a96e]/45 shadow-[0_6px_28px_rgba(0,0,0,0.45)]"
        >
          <div class="flex items-center justify-center space-x-2 mb-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#d97c43] animate-pulse"></span>
            <span class="font-inscription uppercase tracking-[0.24em] text-[11px] sm:text-[12.5px] md:text-[13.5px] text-[#d97c43] font-semibold">
              Pancha-Tattva Mantra
            </span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#d97c43] animate-pulse"></span>
          </div>
          <div class="flex flex-col space-y-1 leading-[1.45] font-serif italic tracking-[0.015em] text-[17px] sm:text-[21px] md:text-[24px] text-[#f4ece1]">
            <span class="block">Jaya Śrī-Kṛṣṇa-Caitanya Prabhu Nityānanda,</span>
            <span class="block">Śrī-Advaita Gadādhara Śrīvāsādi-Gaura-Bhakta-Vṛnda</span>
          </div>
        </button>
      </div>

      <!-- MIDDLE: SACRED COUNTER ALTAR -->
      <div class="relative flex flex-col items-center justify-center my-auto py-2 sm:py-3">
        <div class="relative flex items-center justify-center">

          <!-- Warm Temple Diya Radial Glow Behind Altar -->
          <div
            id="diya-halo"
            class="pointer-events-none absolute w-[290px] h-[290px] sm:w-[340px] sm:h-[340px] md:w-[370px] md:h-[370px] rounded-full diya-ambient"
            style="background: radial-gradient(circle, rgba(217, 124, 67, 0.22) 0%, rgba(200, 169, 110, 0.08) 46%, transparent 72%);"
          ></div>

          <!-- Expanding Ripple Container for Tap Waves -->
          <div
            id="ripple-container"
            class="pointer-events-none absolute w-[230px] h-[230px] sm:w-[270px] sm:h-[270px] md:w-[295px] md:h-[295px] rounded-full"
          ></div>

          <!-- 108-Bead Japa Mala Perimeter Halo Ring (SVG) -->
          <svg
            id="mala-ring-svg"
            class="pointer-events-none absolute w-[280px] h-[280px] sm:w-[325px] sm:h-[325px] md:w-[355px] md:h-[355px]"
            viewBox="0 0 340 340"
          >
            <defs>
              <filter id="bead-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.8" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- Guide Hairline Connecting 108 Beads -->
            <circle cx="170" cy="170" r="154" fill="none" stroke="rgba(200, 169, 110, 0.12)" stroke-width="0.75" />
            <!-- Dynamic 108 Beads Injected by JS -->
            <g id="beads-group"></g>
            <!-- Sumeru (Head Bead) Crown Marker at 12 O'Clock -->
            <g id="sumeru-crown" transform="translate(170, 10)">
              <path d="M0 -4 L4.2 3 L0 7.5 L-4.2 3 Z" fill="#c8a96e" stroke="#f4ece1" stroke-width="0.5" filter="url(#bead-glow)" />
              <circle cx="0" cy="-6.2" r="1.3" fill="#e8d3a7" opacity="0.85" />
            </g>
          </svg>

          <!-- Main Interactive Circular Altar Medallion Button -->
          <button
            id="counter-altar"
            type="button"
            aria-label="Chant one Mahamantra bead (or press Space)"
            class="altar-circle relative w-[230px] h-[230px] sm:w-[270px] sm:h-[270px] md:w-[295px] md:h-[295px] rounded-full flex flex-col items-center justify-center focus:outline-none cursor-pointer border border-[#c8a96e]/35"
          >
            <!-- Inner Antique Brass Hairline Rings -->
            <div class="pointer-events-none absolute inset-[10px] rounded-full border border-[#c8a96e]/15"></div>
            <div class="pointer-events-none absolute inset-[18px] rounded-full border border-dashed border-[#c8a96e]/10"></div>

            <!-- Delicate 8-Petal Inner Lotus Watermark Behind Numeral -->
            <svg class="pointer-events-none absolute w-[180px] h-[180px] sm:w-[200px] sm:h-[200px] opacity-[0.08]" viewBox="0 0 200 200" fill="none" stroke="#e8d3a7" stroke-width="0.9">
              <circle cx="100" cy="100" r="46" />
              <circle cx="100" cy="100" r="76" stroke-dasharray="1 3" />
              <g>
                <path d="M100 18 C114 48 114 68 100 98 C86 68 86 48 100 18 Z" />
                <path d="M100 182 C114 152 114 132 100 102 C86 132 86 152 100 182 Z" />
                <path d="M18 100 C48 114 68 114 98 100 C68 86 48 86 18 100 Z" />
                <path d="M182 100 C152 114 132 114 102 100 C132 86 152 86 182 100 Z" />
              </g>
              <g transform="rotate(45 100 100)">
                <path d="M100 18 C114 48 114 68 100 98 C86 68 86 48 100 18 Z" />
                <path d="M100 182 C114 152 114 132 100 102 C86 132 86 152 100 182 Z" />
                <path d="M18 100 C48 114 68 114 98 100 C68 86 48 86 18 100 Z" />
                <path d="M182 100 C152 114 132 114 102 100 C132 86 152 86 182 100 Z" />
              </g>
            </svg>

            <!-- Bead Stage Whisper Label Above Numeral -->
            <span id="stage-whisper" class="relative z-10 font-inscription uppercase tracking-[0.26em] text-[11px] sm:text-[12.5px] md:text-[13.5px] text-[#c8a96e]/85 mb-0.5 min-h-[16px] transition-opacity duration-500"></span>

            <!-- Glowing Sacred Count Numeral -->
            <div class="relative z-10 flex items-baseline justify-center my-0.5">
              <span id="bead-count" class="font-serif font-normal text-[82px] sm:text-[96px] md:text-[108px] leading-none text-[#f4ece1] numeral-glow tracking-tight transition-transform duration-300">
                0
              </span>
            </div>

            <!-- Fraction & Open Lotus Cradle Beneath Numeral -->
            <div class="relative z-10 flex flex-col items-center mt-0.5">
              <span class="font-inscription text-[11px] sm:text-[12.5px] md:text-[13.5px] tracking-[0.28em] text-[#c8a96e]/70">
                of 108
              </span>

              <!-- Open Lotus Cradle SVG -->
              <svg class="mt-1.5 opacity-75" width="64" height="16" viewBox="0 0 68 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M34 2 C37 7 37 12 34 15.5 C31 12 31 7 34 2 Z" stroke="#c8a96e" stroke-width="0.85" fill="rgba(217,124,67,0.12)" />
                <path d="M34 15.5 C28 14 23 10 21 5.5 C26 6.5 30 9.5 34 15.5 Z" stroke="#c8a96e" stroke-width="0.8" />
                <path d="M34 15.5 C40 14 45 10 47 5.5 C42 6.5 38 9.5 34 15.5 Z" stroke="#c8a96e" stroke-width="0.8" />
                <path d="M34 15.5 C24 16 15 14 10 10.5 C17 10.5 25 12 34 15.5 Z" stroke="#c8a96e" stroke-width="0.7" opacity="0.65" />
                <path d="M34 15.5 C44 16 53 14 58 10.5 C51 10.5 43 12 34 15.5 Z" stroke="#c8a96e" stroke-width="0.7" opacity="0.65" />
              </svg>
            </div>
          </button>
        </div>

        <!-- Gentle keyboard hint -->
        <span class="font-inscription uppercase tracking-[0.22em] text-[10px] sm:text-[11.5px] text-[#c8a96e]/60 mt-2">
          Tap Altar or Press [ Space ]
        </span>
      </div>

      <!-- BOTTOM: HARE KRISHNA MAHAMANTRA -->
      <div class="w-full flex flex-col items-center text-center pb-1 sm:pb-2">
        <button
          id="mahamantra-box"
          type="button"
          aria-label="Illuminate Hare Krishna Mahamantra"
          class="mantra-card mantra-dimmed group relative w-full max-w-2xl rounded-2xl px-5 py-3 sm:px-7 sm:py-4 text-center focus:outline-none cursor-pointer border border-[#c8a96e]/20 hover:border-[#c8a96e]/40 shadow-[0_6px_28px_rgba(0,0,0,0.45)]"
        >
          <div class="flex items-center justify-center space-x-2 mb-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#c8a96e]/70"></span>
            <span class="font-inscription uppercase tracking-[0.24em] text-[11px] sm:text-[12.5px] md:text-[13.5px] text-[#c8a96e]/90 font-medium">
              Hare Krishna Mahamantra · 16 Divine Names
            </span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#c8a96e]/70"></span>
          </div>
          <div class="flex flex-col space-y-1.5 leading-[1.4] font-serif tracking-[0.025em] text-[18px] sm:text-[22px] md:text-[25px] text-[#e8d3a7]">
            <span class="block font-medium">Hare Kṛṣṇa Hare Kṛṣṇa &nbsp;·&nbsp; Kṛṣṇa Kṛṣṇa Hare Hare</span>
            <span class="block font-medium">Hare Rāma Hare Rāma &nbsp;·&nbsp; Rāma Rāma Hare Hare</span>
          </div>
        </button>
      </div>

    </div>

  </main>

  <script>
    (function () {
      // --- State ---
      const TOTAL_BEADS = 108;
      let currentBead = 0;
      let completedMalas = 0;
      let soundEnabled = true;
      let hasAttemptedFullscreen = false;

      // --- DOM Elements ---
      const counterAltar = document.getElementById('counter-altar');
      const beadCountEl = document.getElementById('bead-count');
      const stageWhisperEl = document.getElementById('stage-whisper');
      const beadsGroup = document.getElementById('beads-group');
      const rippleContainer = document.getElementById('ripple-container');
      const panchaTattvaBox = document.getElementById('pancha-tattva-box');
      const mahamantraBox = document.getElementById('mahamantra-box');
      const resetBtn = document.getElementById('reset-btn');
      const soundToggle = document.getElementById('sound-toggle');
      const soundIconOn = document.getElementById('sound-icon-on');
      const soundIconOff = document.getElementById('sound-icon-off');
      const fullscreenToggle = document.getElementById('fullscreen-toggle');
      const fullscreenIconEnter = document.getElementById('fullscreen-icon-enter');
      const fullscreenIconExit = document.getElementById('fullscreen-icon-exit');
      const particleCanvas = document.getElementById('particle-canvas');
      const ctx = particleCanvas.getContext('2d');

      // --- 1. Auto-request Browser Fullscreen on first user gesture ---
      function requestFullscreenImmersion() {
        if (!hasAttemptedFullscreen) {
          hasAttemptedFullscreen = true;
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        }
      }

      // --- 2. Build 108-Bead Perimeter Halo SVG ---
      const beadElements = [];
      const centerX = 170;
      const centerY = 170;
      const radius = 154;

      for (let i = 1; i <= TOTAL_BEADS; i++) {
        // Distribute 108 beads clockwise starting right of 12 o'clock Sumeru
        const angleDeg = -90 + (i / (TOTAL_BEADS + 1)) * 360;
        const angleRad = (angleDeg * Math.PI) / 180;
        const x = centerX + radius * Math.cos(angleRad);
        const y = centerY + radius * Math.sin(angleRad);

        const isQuarterMarker = i === 27 || i === 54 || i === 81;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x.toFixed(2));
        circle.setAttribute('cy', y.toFixed(2));
        circle.setAttribute('r', isQuarterMarker ? '2.4' : '1.4');
        circle.setAttribute('fill', isQuarterMarker ? 'rgba(200, 169, 110, 0.42)' : 'rgba(200, 169, 110, 0.18)');
        circle.style.transition = 'fill 0.35s ease, r 0.35s ease';

        beadsGroup.appendChild(circle);
        beadElements.push({ el: circle, isQuarter: isQuarterMarker });
      }

      // --- 3. Web Audio API: Sacred Tulsi Wood Click & Tanpura Resonance ---
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playTulsiBeadSound(isSumeruCompletion = false) {
        if (!soundEnabled) return;
        try {
          initAudio();
          if (!audioCtx) return;

          const now = audioCtx.currentTime;

          // Tactile Carved Tulsi Wooden Bead Click (Significantly Boosted Volume)
          const clickOsc = audioCtx.createOscillator();
          const clickGain = audioCtx.createGain();
          clickOsc.type = 'triangle';
          clickOsc.frequency.setValueAtTime(210, now);
          clickOsc.frequency.exponentialRampToValueAtTime(70, now + 0.05);

          clickGain.gain.setValueAtTime(0.7, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          clickOsc.connect(clickGain);
          clickGain.connect(audioCtx.destination);
          clickOsc.start(now);
          clickOsc.stop(now + 0.065);

          // Warm Tanpura / Temple Bell Harmonic Resonance (Significantly Boosted Volume)
          const droneOsc = audioCtx.createOscillator();
          const droneGain = audioCtx.createGain();
          droneOsc.type = 'sine';
          const baseFreq = isSumeruCompletion ? 554.37 : 277.18;
          droneOsc.frequency.setValueAtTime(baseFreq, now);

          const duration = isSumeruCompletion ? 2.8 : 0.75;
          const peakGain = isSumeruCompletion ? 0.65 : 0.32;

          droneGain.gain.setValueAtTime(0.001, now);
          droneGain.gain.linearRampToValueAtTime(peakGain, now + 0.03);
          droneGain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

          droneOsc.connect(droneGain);
          droneGain.connect(audioCtx.destination);
          droneOsc.start(now);
          droneOsc.stop(now + duration + 0.05);
        } catch (err) {
          // Ignore audio restrictions
        }
      }

      // --- 4. Golden Diya Particle Engine (HTML5 Canvas) ---
      let particles = [];

      function resizeCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function spawnDiyaParticles(originX, originY, count = 9) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 20 + Math.random() * 95;
          particles.push({
            x: originX + Math.cos(angle) * (dist * 0.35),
            y: originY + Math.sin(angle) * (dist * 0.35),
            vx: (Math.random() - 0.5) * 0.65,
            vy: -0.45 - Math.random() * 0.95,
            radius: 0.9 + Math.random() * 1.8,
            alpha: 0.65 + Math.random() * 0.35,
            decay: 0.007 + Math.random() * 0.009,
            hue: Math.random() > 0.4 ? '#e8d3a7' : '#d97c43'
          });
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.hue;
          ctx.shadowColor = '#d97c43';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(animateParticles);
      }

      // --- 5. UI Illumination & State Sync ---
      function setMantraIllumination(activeTarget, triggerPulse = false) {
        if (activeTarget === 'pancha') {
          panchaTattvaBox.classList.add('mantra-illuminated');
          panchaTattvaBox.classList.remove('mantra-dimmed');
          mahamantraBox.classList.add('mantra-dimmed');
          mahamantraBox.classList.remove('mantra-illuminated');
          if (triggerPulse) {
            panchaTattvaBox.classList.remove('stanza-pulse');
            void panchaTattvaBox.offsetWidth;
            panchaTattvaBox.classList.add('stanza-pulse');
          }
        } else {
          mahamantraBox.classList.add('mantra-illuminated');
          mahamantraBox.classList.remove('mantra-dimmed');
          panchaTattvaBox.classList.add('mantra-dimmed');
          panchaTattvaBox.classList.remove('mantra-illuminated');
          if (triggerPulse) {
            mahamantraBox.classList.remove('stanza-pulse');
            void mahamantraBox.offsetWidth;
            mahamantraBox.classList.add('stanza-pulse');
          }
        }
      }

      function updateBeadHaloUI() {
        beadCountEl.textContent = currentBead;

        // Stage whisper
        if (stageWhisperEl) {
          if (currentBead === 0) {
            stageWhisperEl.textContent = completedMalas > 0 ? `Mala ${completedMalas}` : '';
            setMantraIllumination('pancha', false);
          } else if (currentBead === 108) {
            stageWhisperEl.textContent = `Purna · Mala ${completedMalas + 1} Done`;
            setMantraIllumination('mahamantra', false);
          } else {
            stageWhisperEl.textContent = completedMalas > 0 ? `Mala ${completedMalas + 1} · Bead ${currentBead}` : `Bead ${currentBead}`;
            setMantraIllumination('mahamantra', false);
          }
        }

        // Update 108 perimeter beads
        for (let i = 0; i < TOTAL_BEADS; i++) {
          const item = beadElements[i];
          const beadIndex = i + 1;
          if (beadIndex < currentBead) {
            item.el.setAttribute('fill', '#c8a96e');
            item.el.setAttribute('r', item.isQuarter ? '2.5' : '1.8');
          } else if (beadIndex === currentBead) {
            item.el.setAttribute('fill', '#f4ece1');
            item.el.setAttribute('r', '3.1');
          } else {
            item.el.setAttribute(
              'fill',
              item.isQuarter ? 'rgba(200, 169, 110, 0.42)' : 'rgba(200, 169, 110, 0.18)'
            );
            item.el.setAttribute('r', item.isQuarter ? '2.4' : '1.4');
          }
        }
      }

      function createRipple() {
        const ring = document.createElement('div');
        ring.className = 'ripple-ring';
        rippleContainer.appendChild(ring);
        setTimeout(() => {
          ring.remove();
        }, 1250);
      }

      // --- 6. Increment Chanting Counter ---
      function incrementChant(clientX, clientY) {
        requestFullscreenImmersion();

        if (currentBead >= TOTAL_BEADS) {
          currentBead = 0;
        } else {
          currentBead += 1;
        }

        const isMalaDone = currentBead === TOTAL_BEADS;
        if (isMalaDone) {
          completedMalas += 1;
        }

        // Tactile press animation
        counterAltar.classList.add('pressed');
        setTimeout(() => counterAltar.classList.remove('pressed'), 220);

        // Update UI & pulse the active Mahamantra stanza
        updateBeadHaloUI();
        if (currentBead > 0) {
          setMantraIllumination('mahamantra', true);
        }

        // Expanding golden ripple wave
        createRipple();

        // Spawn golden diya sparks
        const altarRect = counterAltar.getBoundingClientRect();
        const x = clientX ? clientX : (altarRect.left + altarRect.width / 2);
        const y = clientY ? clientY : (altarRect.top + altarRect.height / 2);
        spawnDiyaParticles(x, y, isMalaDone ? 28 : 10);

        // Play synthesized Tulsi wooden bead click + tanpura resonance
        playTulsiBeadSound(isMalaDone);
      }

      // --- 7. Event Listeners ---
      counterAltar.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        incrementChant(e.clientX, e.clientY);
      });

      // Keyboard accessibility (Space / Enter)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          if (document.activeElement !== panchaTattvaBox && document.activeElement !== mahamantraBox) {
            e.preventDefault();
            incrementChant();
          }
        }
      });

      // Interactive Mantra Focus
      panchaTattvaBox.addEventListener('click', () => {
        requestFullscreenImmersion();
        setMantraIllumination('pancha', true);
        const rect = panchaTattvaBox.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
        playTulsiBeadSound(false);
      });

      mahamantraBox.addEventListener('click', () => {
        requestFullscreenImmersion();
        setMantraIllumination('mahamantra', true);
        const rect = mahamantraBox.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
        playTulsiBeadSound(false);
      });

      // Simple, instant Reset button
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentBead > 0) {
          currentBead = 0;
        } else if (completedMalas > 0) {
          completedMalas = 0;
        }
        updateBeadHaloUI();
        createRipple();
        playTulsiBeadSound(false);
        const rect = resetBtn.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
      });

      // Sound Toggle
      soundToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          soundIconOn.classList.remove('hidden');
          soundIconOff.classList.add('hidden');
          playTulsiBeadSound(false);
        } else {
          soundIconOn.classList.add('hidden');
          soundIconOff.classList.remove('hidden');
        }
      });

      // Fullscreen Toggle
      if (fullscreenToggle) {
        fullscreenToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            fullscreenIconEnter.classList.add('hidden');
            fullscreenIconExit.classList.remove('hidden');
          } else {
            document.exitFullscreen().catch(() => {});
            fullscreenIconEnter.classList.remove('hidden');
            fullscreenIconExit.classList.add('hidden');
          }
        });

        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement) {
            fullscreenIconEnter.classList.remove('hidden');
            fullscreenIconExit.classList.add('hidden');
          } else {
            fullscreenIconEnter.classList.add('hidden');
            fullscreenIconExit.classList.remove('hidden');
          }
          resizeCanvas();
        });
      }

      // Start animation loop on window load
      window.onload = function () {
        resizeCanvas();
        updateBeadHaloUI();
        animateParticles();
      };
    })();
  </script>
</body>
</html>
