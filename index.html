<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080706" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Mahamantra Counter</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cormorant Garamond for sacred numerals & Cinzel for inscriptions -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#080706',
            charcoal: '#0e0d0c',
            earth: '#241d17',
            stone: '#181411',
            gold: {
              light: '#e8d3a7',
              DEFAULT: '#c8a96e',
              antique: '#9e7e46',
              dim: '#594728'
            },
            saffron: {
              glow: '#d97c43',
              DEFAULT: '#c46d3b',
              deep: '#783b19'
            },
            ivory: '#f4ece1'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            inscription: ['"Cinzel"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #050404;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Cormorant Garamond', serif;
      color: #e8d3a7;
      touch-action: manipulation;
    }

    /* Ambient Temple Diya Underglow & Stone Sanctuary Background */
    .sanctuary-bg {
      background:
        radial-gradient(circle at 50% 50%, rgba(196, 109, 59, 0.16) 0%, rgba(200, 169, 110, 0.08) 38%, rgba(24, 20, 17, 0.75) 68%, #080706 100%),
        radial-gradient(circle at 50% 20%, rgba(200, 169, 110, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(217, 124, 67, 0.07) 0%, transparent 50%),
        linear-gradient(180deg, #090807 0%, #120f0c 50%, #070605 100%);
    }

    /* Responsive altar circle and surrounding elements using vmin to never clip on mobile */
    .altar-circle {
      width: clamp(180px, 47vmin, 290px);
      height: clamp(180px, 47vmin, 290px);
      background:
        radial-gradient(circle at 50% 38%, rgba(46, 36, 28, 0.94) 0%, rgba(19, 16, 14, 0.98) 65%, #0b0908 100%);
      box-shadow:
        0 18px 45px -10px rgba(0, 0, 0, 0.95),
        0 0 45px 2px rgba(196, 109, 59, 0.14),
        inset 0 1px 2px rgba(232, 211, 167, 0.28),
        inset 0 -10px 24px rgba(8, 7, 6, 0.92),
        inset 0 0 30px rgba(200, 169, 110, 0.1);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: manipulation;
    }

    .altar-circle:hover {
      box-shadow:
        0 24px 60px -10px rgba(0, 0, 0, 0.98),
        0 0 55px 6px rgba(217, 124, 67, 0.22),
        inset 0 1px 3px rgba(232, 211, 167, 0.35),
        inset 0 -10px 24px rgba(8, 7, 6, 0.9),
        inset 0 0 38px rgba(200, 169, 110, 0.14);
    }

    .altar-circle.pressed {
      transform: scale(0.955);
      box-shadow:
        0 10px 25px -6px rgba(0, 0, 0, 0.98),
        0 0 65px 12px rgba(217, 124, 67, 0.32),
        inset 0 1px 4px rgba(232, 211, 167, 0.45),
        inset 0 -6px 18px rgba(8, 7, 6, 0.88),
        inset 0 0 45px rgba(196, 109, 59, 0.25);
    }

    #mala-ring-svg {
      width: clamp(220px, 57vmin, 350px);
      height: clamp(220px, 57vmin, 350px);
    }

    #diya-halo {
      width: clamp(230px, 60vmin, 365px);
      height: clamp(230px, 60vmin, 365px);
    }

    #ripple-container {
      width: clamp(180px, 47vmin, 290px);
      height: clamp(180px, 47vmin, 290px);
    }

    #bead-count {
      font-size: clamp(58px, 15vmin, 104px);
    }

    /* Diya Flame Breathing Animation */
    @keyframes diyaBreathe {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(1);
      }

      50% {
        opacity: 0.95;
        transform: scale(1.04);
      }
    }

    .diya-ambient {
      animation: diyaBreathe 6.5s ease-in-out infinite;
    }

    /* Slow rotation for background sacred yantra */
    @keyframes slowMandala {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sacred-rotation {
      animation: slowMandala 280s linear infinite;
    }

    /* Sacred Numeral Glow */
    .numeral-glow {
      text-shadow:
        0 0 28px rgba(217, 124, 67, 0.42),
        0 0 8px rgba(232, 211, 167, 0.25),
        0 2px 10px rgba(0, 0, 0, 0.95);
      font-feature-settings: "lnum" 1, "tnum" 1;
    }

    /* Expanding Ripple Effect on Tap */
    @keyframes sacredRipple {
      0% {
        transform: translate(-50%, -50%) scale(0.88);
        opacity: 0.65;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.38);
        opacity: 0;
      }
    }

    .ripple-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      border: 1px solid rgba(200, 169, 110, 0.55);
      box-shadow: 0 0 25px rgba(196, 109, 59, 0.35);
      pointer-events: none;
      animation: sacredRipple 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Mantra stanza illumination states */
    .mantra-card {
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: manipulation;
    }

    .mantra-illuminated {
      color: #f4ece1;
      text-shadow:
        0 0 20px rgba(217, 124, 67, 0.55),
        0 0 7px rgba(232, 211, 167, 0.3);
      opacity: 0.98;
      background: radial-gradient(ellipse at 50% 50%, rgba(196, 109, 59, 0.18) 0%, rgba(200, 169, 110, 0.05) 65%, rgba(14, 13, 12, 0.4) 100%);
      border-color: rgba(200, 169, 110, 0.38);
      box-shadow: 0 0 26px rgba(196, 109, 59, 0.15);
    }

    .mantra-dimmed {
      color: #c8a96e;
      text-shadow: 0 0 8px rgba(200, 169, 110, 0.12);
      opacity: 0.65;
      background: rgba(14, 13, 12, 0.4);
      border-color: rgba(200, 169, 110, 0.14);
    }

    /* Pulse when a mantra stanza is actively tapped or incremented */
    @keyframes stanzaPulse {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
      }
    }

    .stanza-pulse {
      animation: stanzaPulse 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Small height adjustments for devices under 680px */
    @media (max-height: 680px) {
      .mantra-card {
        padding-top: 8px !important;
        padding-bottom: 8px !important;
      }

      .mantra-text-primary {
        font-size: 15px !important;
        line-height: 1.35 !important;
      }

      .mantra-tag {
        font-size: 10px !important;
        margin-bottom: 3px !important;
      }

      #tap-hint {
        margin-top: 4px !important;
      }
    }

    /* Ultra-compact / mobile landscape adjustments */
    @media (max-height: 520px) {
      #sanctuary-app {
        padding-top: 6px !important;
        padding-bottom: 6px !important;
      }

      .mantra-card {
        padding: 6px 12px !important;
      }

      .mantra-text-primary {
        font-size: 13px !important;
        line-height: 1.25 !important;
      }

      #tap-hint {
        display: none !important;
      }

      #lotus-cradle {
        display: none !important;
      }
    }
  </style>
</head>

<body class="w-full h-full h-[100dvh] overflow-hidden m-0 p-0 bg-[#050404]">

  <!-- Edge-to-Edge Full Screen Sanctuary Container -->
  <main id="sanctuary-app"
    class="relative w-full h-full h-[100dvh] sanctuary-bg overflow-hidden flex flex-col justify-between items-center select-none"
    style="padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right));">

    <!-- 1. Procedural Stone Grain Filter Overlay -->
    <svg class="pointer-events-none absolute inset-0 w-full h-full opacity-[0.035] z-0" aria-hidden="true">
      <filter id="stone-paper-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0 0.75 0 0  0 0 0 0.65 0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#stone-paper-grain)" />
    </svg>

    <!-- 2. Sacred Concentric Lotus Yantra Watermark -->
    <div
      class="pointer-events-none absolute inset-0 flex items-center justify-center opacity-[0.032] z-0 overflow-hidden"
      aria-hidden="true">
      <svg class="w-[680px] h-[680px] sacred-rotation" viewBox="0 0 400 400" fill="none" stroke="#c8a96e"
        stroke-width="0.6">
        <circle cx="200" cy="200" r="190" stroke-dasharray="2 4" />
        <circle cx="200" cy="200" r="165" />
        <circle cx="200" cy="200" r="138" />
        <circle cx="200" cy="200" r="96" />
        <g>
          <path d="M200 10 C215 45 215 65 200 104 C185 65 185 45 200 10 Z" />
          <path d="M200 390 C215 355 215 335 200 296 C185 335 185 355 200 390 Z" />
          <path d="M10 200 C45 215 65 215 104 200 C65 185 45 185 10 200 Z" />
          <path d="M390 200 C355 215 335 215 296 200 C335 185 355 185 390 200 Z" />
          <g transform="rotate(45 200 200)">
            <path d="M200 10 C215 45 215 65 200 104 C185 65 185 45 200 10 Z" />
            <path d="M200 390 C215 355 215 335 200 296 C185 335 185 355 200 390 Z" />
            <path d="M10 200 C45 215 65 215 104 200 C65 185 45 185 10 200 Z" />
            <path d="M390 200 C355 215 335 215 296 200 C335 185 355 185 390 200 Z" />
          </g>
          <g transform="rotate(22.5 200 200)">
            <path d="M200 35 C210 62 210 78 200 104 C190 78 190 62 200 35 Z" />
            <path d="M200 365 C210 338 210 322 200 296 C190 322 190 338 200 365 Z" />
            <path d="M35 200 C62 210 78 210 104 200 C78 190 62 190 35 200 Z" />
            <path d="M365 200 C338 210 322 210 296 200 C322 190 338 190 365 200 Z" />
          </g>
          <g transform="rotate(67.5 200 200)">
            <path d="M200 35 C210 62 210 78 200 104 C190 78 190 62 200 35 Z" />
            <path d="M200 365 C210 338 210 322 200 296 C190 322 190 338 200 365 Z" />
            <path d="M35 200 C62 210 78 210 104 200 C78 190 62 190 35 200 Z" />
            <path d="M365 200 C338 210 322 210 296 200 C322 190 338 190 365 200 Z" />
          </g>
        </g>
        <rect x="92" y="92" width="216" height="216" />
        <rect x="92" y="92" width="216" height="216" transform="rotate(45 200 200)" />
      </svg>
    </div>

    <!-- 3. Interactive Floating Diya Spark Particles Canvas -->
    <canvas id="particle-canvas" class="pointer-events-none absolute inset-0 w-full h-full z-20"></canvas>

    <!-- 4. TOP BAR: Sacred Status Badge (Left) + Quick Actions (Right) -->
    <header class="relative z-30 w-full max-w-3xl flex items-center justify-between px-1 py-1 sm:py-2">
      <!-- Left: Completed Malas / Rounds Badge -->
      <div id="mala-status-pill"
        class="flex items-center space-x-2 py-1 px-2.5 sm:px-3 rounded-full border border-[#c8a96e]/25 bg-[#181411]/85 backdrop-blur-md shadow-[0_3px_12px_rgba(0,0,0,0.5)]">
        <span class="w-2 h-2 rounded-full bg-[#d97c43] shadow-[0_0_8px_#d97c43]"></span>
        <span class="font-inscription uppercase tracking-[0.18em] text-[10px] sm:text-[11px] text-[#e8d3a7]">
          Mala <span id="mala-round-num" class="font-bold text-[#f4ece1]">0</span>
        </span>
        <span class="text-[#c8a96e]/40 text-[10px]">·</span>
        <span id="header-progress-text" class="font-sans text-[10px] sm:text-[11px] text-[#c8a96e]/80 tracking-wide font-medium">
          0/108
        </span>
      </div>

      <!-- Right: Action Controls (Undo, Sound, Haptic, Reset, Fullscreen) -->
      <div class="flex items-center space-x-1 sm:space-x-1.5">
        <!-- Undo Button (Essential for mobile one-handed chanting mistakes) -->
        <button id="undo-btn" type="button" aria-label="Undo previous bead" title="Undo previous bead"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/85 backdrop-blur-md text-[#c8a96e]/75 hover:text-[#e8d3a7] active:scale-90 transition-all focus:outline-none cursor-pointer">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
          </svg>
        </button>

        <!-- Haptic Vibration Toggle (Mobile Friendly) -->
        <button id="haptic-toggle" type="button" aria-label="Toggle haptic vibration feedback" title="Toggle vibration"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/85 backdrop-blur-md text-[#c8a96e]/75 hover:text-[#e8d3a7] active:scale-90 transition-all focus:outline-none cursor-pointer">
          <svg id="haptic-icon-on" class="w-3.5 h-3.5 text-[#e8d3a7]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="3" ry="3" />
            <line x1="1" y1="10" x2="1" y2="14" />
            <line x1="23" y1="10" x2="23" y2="14" />
          </svg>
          <svg id="haptic-icon-off" class="w-3.5 h-3.5 text-[#c8a96e]/40 hidden" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="3" ry="3" />
            <line x1="2" y1="2" x2="22" y2="22" />
          </svg>
        </button>

        <!-- Sound Toggle -->
        <button id="sound-toggle" type="button" aria-label="Toggle sacred Tulsi bead acoustics" title="Toggle sound"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/85 backdrop-blur-md text-[#c8a96e]/75 hover:text-[#e8d3a7] active:scale-90 transition-all focus:outline-none cursor-pointer">
          <svg id="sound-icon-on" class="w-3.5 h-3.5 text-[#e8d3a7]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8">
            <circle cx="12" cy="12" r="2.5" fill="currentColor" />
            <path d="M7.5 7.5 C5 10 5 14 7.5 16.5" stroke-linecap="round" />
            <path d="M16.5 7.5 C19 10 19 14 16.5 16.5" stroke-linecap="round" />
          </svg>
          <svg id="sound-icon-off" class="w-3.5 h-3.5 text-[#c8a96e]/40 hidden" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="2" />
            <path d="M5 19 L19 5" stroke-linecap="round" />
          </svg>
        </button>

        <!-- Reset Button -->
        <button id="reset-btn" type="button" aria-label="Reset counter" title="Click to reset bead counter"
          class="group flex items-center space-x-1 py-1 px-2.5 sm:px-3 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/85 backdrop-blur-md text-[#c8a96e]/80 hover:text-[#e8d3a7] active:scale-90 transition-all focus:outline-none cursor-pointer">
          <svg class="w-3.5 h-3.5 text-[#e8d3a7] group-hover:-rotate-90 transition-transform duration-300"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 3v5h5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="font-inscription uppercase tracking-[0.16em] text-[9px] sm:text-[10px]">
            Reset
          </span>
        </button>

        <!-- Fullscreen Immersion Button (Gracefully hidden on devices where unsupported) -->
        <button id="fullscreen-toggle" type="button" aria-label="Toggle fullscreen mode" title="Toggle Fullscreen"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-[#c8a96e]/25 hover:border-[#c8a96e]/60 bg-[#181411]/85 backdrop-blur-md text-[#c8a96e]/75 hover:text-[#e8d3a7] active:scale-90 transition-all focus:outline-none cursor-pointer">
          <svg id="fullscreen-icon-enter" class="w-3.5 h-3.5 text-[#e8d3a7]" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6">
            <path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg id="fullscreen-icon-exit" class="w-3.5 h-3.5 text-[#e8d3a7] hidden" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6">
            <path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 5. MAIN SACRED STAGE: 
         TOP: Pancha-Tattva Mantra
         MIDDLE: Sacred Counter Altar
         BOTTOM: Hare Krishna Mahamantra
    -->
    <div class="relative z-10 w-full max-w-3xl flex-1 flex flex-col justify-between items-center py-1 sm:py-2 min-h-0">

      <!-- TOP: PANCHA-TATTVA MANTRA -->
      <div class="w-full flex flex-col items-center text-center">
        <button id="pancha-tattva-box" type="button" aria-label="Illuminate Pancha-Tattva Maha-Mantra"
          class="mantra-card mantra-illuminated group relative w-full max-w-2xl rounded-xl sm:rounded-2xl px-3.5 py-2 sm:px-6 sm:py-3.5 text-center focus:outline-none cursor-pointer border border-[#c8a96e]/25 hover:border-[#c8a96e]/45 shadow-[0_4px_22px_rgba(0,0,0,0.45)]">
          <div class="mantra-tag flex items-center justify-center space-x-1.5 mb-1 sm:mb-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#d97c43] animate-pulse"></span>
            <span
              class="font-inscription uppercase tracking-[0.2em] text-[10px] sm:text-[12px] md:text-[13px] text-[#d97c43] font-semibold">
              Pancha-Tattva Mantra
            </span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#d97c43] animate-pulse"></span>
          </div>
          <div
            class="mantra-text-primary flex flex-col space-y-0.5 leading-[1.35] sm:leading-[1.45] font-serif italic tracking-[0.015em] text-[14px] xs:text-[15.5px] sm:text-[19px] md:text-[22px] text-[#f4ece1]">
            <span class="block">Jaya Śrī-Kṛṣṇa-Caitanya Prabhu Nityānanda,</span>
            <span class="block">Śrī-Advaita Gadādhara Śrīvāsādi-Gaura-Bhakta-Vṛnda</span>
          </div>
        </button>
      </div>

      <!-- MIDDLE: SACRED COUNTER ALTAR & 108 BEADS -->
      <div id="altar-section" class="relative flex flex-col items-center justify-center my-auto py-1 sm:py-2">
        <div id="altar-touch-wrapper" class="relative flex items-center justify-center cursor-pointer">

          <!-- Warm Temple Diya Radial Glow Behind Altar -->
          <div id="diya-halo"
            class="pointer-events-none absolute rounded-full diya-ambient"
            style="background: radial-gradient(circle, rgba(217, 124, 67, 0.22) 0%, rgba(200, 169, 110, 0.08) 46%, transparent 72%);">
          </div>

          <!-- Expanding Ripple Container for Tap Waves -->
          <div id="ripple-container"
            class="pointer-events-none absolute rounded-full">
          </div>

          <!-- 108-Bead Japa Mala Perimeter Halo Ring (SVG) -->
          <svg id="mala-ring-svg"
            class="pointer-events-none absolute"
            viewBox="0 0 340 340">
            <defs>
              <filter id="bead-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.8" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- Guide Hairline Connecting 108 Beads -->
            <circle cx="170" cy="170" r="154" fill="none" stroke="rgba(200, 169, 110, 0.12)" stroke-width="0.75" />
            <!-- Dynamic 108 Beads Injected by JS -->
            <g id="beads-group"></g>
            <!-- Sumeru (Head Bead) Crown Marker at 12 O'Clock -->
            <g id="sumeru-crown" transform="translate(170, 10)">
              <path d="M0 -4 L4.2 3 L0 7.5 L-4.2 3 Z" fill="#c8a96e" stroke="#f4ece1" stroke-width="0.5"
                filter="url(#bead-glow)" />

        <!-- Gentle interaction hint (adaptive for touch vs keyboard) -->
        <span id="tap-hint" class="font-inscription uppercase tracking-[0.18em] sm:tracking-[0.22em] text-[9px] sm:text-[11px] text-[#c8a96e]/60 mt-1.5 sm:mt-2">
          Tap circle to chant

      <div class="w-full flex flex-col items-center text-center">
        <button id="mahamantra-box" type="button" aria-label="Illuminate Hare Krishna Mahamantra"
          class="mantra-card mantra-dimmed group relative w-full max-w-2xl rounded-xl sm:rounded-2xl px-3.5 py-2 sm:px-6 sm:py-3.5 text-center focus:outline-none cursor-pointer border border-[#c8a96e]/20 hover:border-[#c8a96e]/40 shadow-[0_4px_22px_rgba(0,0,0,0.45)]">
          <div class="mantra-tag flex items-center justify-center space-x-1.5 mb-1 sm:mb-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#c8a96e]/70"></span>
            <span
              class="font-inscription uppercase tracking-[0.2em] text-[10px] sm:text-[12px] md:text-[13px] text-[#c8a96e]/90 font-medium">
              Hare Krishna Mahamantra · 16 Divine Names
            </span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#c8a96e]/70"></span>
          </div>
          <div
            class="mantra-text-primary flex flex-col space-y-0.5 sm:space-y-1 leading-[1.3] sm:leading-[1.4] font-serif tracking-[0.02em] text-[15px] xs:text-[16.5px] sm:text-[20px] md:text-[23px] text-[#e8d3a7]">
            <span class="block font-medium">Hare Kṛṣṇa Hare Kṛṣṇa &nbsp;·&nbsp; Kṛṣṇa Kṛṣṇa Hare Hare</span>
            <span class="block font-medium">Hare Rāma Hare Rāma &nbsp;·&nbsp; Rāma Rāma Hare Hare</span>
          </div>
        </button>

    </div>

  </main>

  <script>
    (function () {
      // --- Persistence Keys ---
      const STORAGE_KEY = 'japa_counter_state_v1';

      // --- State ---
      const TOTAL_BEADS = 108;
      let currentBead = 0;
      let completedMalas = 0;
      let soundEnabled = true;
      let hapticEnabled = true;
      let wakeLock = null;

      // Restore saved state if exists
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (typeof parsed.currentBead === 'number' && parsed.currentBead >= 0 && parsed.currentBead <= TOTAL_BEADS) {
            currentBead = parsed.currentBead;
          }
          if (typeof parsed.completedMalas === 'number' && parsed.completedMalas >= 0) {
            completedMalas = parsed.completedMalas;
          }
          if (typeof parsed.soundEnabled === 'boolean') {
            soundEnabled = parsed.soundEnabled;
          }
          if (typeof parsed.hapticEnabled === 'boolean') {
            hapticEnabled = parsed.hapticEnabled;
          }
        }
      } catch (err) {
        // Ignore localStorage error
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            currentBead,
            completedMalas,
            soundEnabled,
            hapticEnabled
          }));
        } catch (err) {}
      }

      // --- DOM Elements ---
      const counterAltar = document.getElementById('counter-altar');
      const altarTouchWrapper = document.getElementById('altar-touch-wrapper');
      const beadCountEl = document.getElementById('bead-count');
      const stageWhisperEl = document.getElementById('stage-whisper');
      const beadsGroup = document.getElementById('beads-group');
      const rippleContainer = document.getElementById('ripple-container');
      const panchaTattvaBox = document.getElementById('pancha-tattva-box');
      const mahamantraBox = document.getElementById('mahamantra-box');
      const resetBtn = document.getElementById('reset-btn');
      const undoBtn = document.getElementById('undo-btn');
      const soundToggle = document.getElementById('sound-toggle');
      const soundIconOn = document.getElementById('sound-icon-on');
      const soundIconOff = document.getElementById('sound-icon-off');
      const hapticToggle = document.getElementById('haptic-toggle');
      const hapticIconOn = document.getElementById('haptic-icon-on');
      const hapticIconOff = document.getElementById('haptic-icon-off');
      const fullscreenToggle = document.getElementById('fullscreen-toggle');
      const fullscreenIconEnter = document.getElementById('fullscreen-icon-enter');
      const fullscreenIconExit = document.getElementById('fullscreen-icon-exit');
      const malaRoundNum = document.getElementById('mala-round-num');
      const headerProgressText = document.getElementById('header-progress-text');
      const tapHint = document.getElementById('tap-hint');
      const particleCanvas = document.getElementById('particle-canvas');
      const ctx = particleCanvas.getContext('2d');

      // Update tap hint for physical touch vs desktop keyboard
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (tapHint) {
        tapHint.textContent = isTouchDevice ? 'Tap circle to chant' : 'Tap circle or press [ Space ]';
      }

      // Screen Wake Lock API to prevent mobile screen sleep during Japa
      async function keepScreenAwake() {
        if ('wakeLock' in navigator) {
          try {
            if (!wakeLock) {
              wakeLock = await navigator.wakeLock.request('screen');
              wakeLock.addEventListener('release', () => {
                wakeLock = null;
              });
            }
          } catch (e) {}
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          keepScreenAwake();
        }
      });

      // --- Haptic Feedback ---
      function triggerHaptic(type = 'bead') {
        if (!hapticEnabled || !navigator.vibrate) return;
        try {
          if (type === 'bead') {
            navigator.vibrate(12);
          } else if (type === 'quarter') {
            navigator.vibrate([15, 35, 15]);
          } else if (type === 'sumeru') {
            navigator.vibrate([35, 45, 35, 45, 60]);
          } else if (type === 'undo') {
            navigator.vibrate(22);
          }
        } catch (e) {}
      }

      // --- Build 108-Bead Perimeter Halo SVG ---
      const beadElements = [];
      const centerX = 170;
      const centerY = 170;
      const radius = 154;

      for (let i = 1; i <= TOTAL_BEADS; i++) {
        const angleDeg = -90 + (i / (TOTAL_BEADS + 1)) * 360;
        const angleRad = (angleDeg * Math.PI) / 180;
        const x = centerX + radius * Math.cos(angleRad);
        const y = centerY + radius * Math.sin(angleRad);

        const isQuarterMarker = i === 27 || i === 54 || i === 81;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x.toFixed(2));
        circle.setAttribute('cy', y.toFixed(2));
        circle.setAttribute('r', isQuarterMarker ? '2.4' : '1.4');
        circle.setAttribute('fill', isQuarterMarker ? 'rgba(200, 169, 110, 0.42)' : 'rgba(200, 169, 110, 0.18)');
        circle.style.transition = 'fill 0.3s ease, r 0.3s ease';

        beadsGroup.appendChild(circle);
        beadElements.push({ el: circle, isQuarter: isQuarterMarker });
      }

      // --- Web Audio API: Sacred Tulsi Wood Click & Tanpura Resonance ---
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playTulsiBeadSound(isSumeruCompletion = false) {
        if (!soundEnabled) return;
        try {
          initAudio();
          if (!audioCtx) return;

          const now = audioCtx.currentTime;

          // Tactile Carved Tulsi Wooden Bead Click
          const clickOsc = audioCtx.createOscillator();
          const clickGain = audioCtx.createGain();
          clickOsc.type = 'triangle';
          clickOsc.frequency.setValueAtTime(220, now);
          clickOsc.frequency.exponentialRampToValueAtTime(70, now + 0.05);

          clickGain.gain.setValueAtTime(0.7, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          clickOsc.connect(clickGain);
          clickGain.connect(audioCtx.destination);
          clickOsc.start(now);
          clickOsc.stop(now + 0.065);

          // Warm Tanpura / Temple Bell Harmonic Resonance
          const droneOsc = audioCtx.createOscillator();
          const droneGain = audioCtx.createGain();
          droneOsc.type = 'sine';
          const baseFreq = isSumeruCompletion ? 554.37 : 277.18;
          droneOsc.frequency.setValueAtTime(baseFreq, now);

          const duration = isSumeruCompletion ? 2.6 : 0.7;
          const peakGain = isSumeruCompletion ? 0.65 : 0.32;

          droneGain.gain.setValueAtTime(0.001, now);
          droneGain.gain.linearRampToValueAtTime(peakGain, now + 0.03);
          droneGain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

          droneOsc.connect(droneGain);
          droneGain.connect(audioCtx.destination);
          droneOsc.start(now);
          droneOsc.stop(now + duration + 0.05);
        } catch (err) {}
      }

      // --- Golden Diya Particle Engine (HTML5 Canvas) ---
      let particles = [];

      function resizeCanvas() {
        if (particleCanvas) {
          particleCanvas.width = window.innerWidth;
          particleCanvas.height = window.innerHeight;
        }
      }

      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
      resizeCanvas();

      function spawnDiyaParticles(originX, originY, count = 8) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 15 + Math.random() * 80;
          particles.push({
            x: originX + Math.cos(angle) * (dist * 0.35),
            y: originY + Math.sin(angle) * (dist * 0.35),
            vx: (Math.random() - 0.5) * 0.6,
            vy: -0.4 - Math.random() * 0.85,
            radius: 0.9 + Math.random() * 1.6,
            alpha: 0.65 + Math.random() * 0.35,
            decay: 0.008 + Math.random() * 0.01,
            hue: Math.random() > 0.4 ? '#e8d3a7' : '#d97c43'
          });
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.hue;
          ctx.shadowColor = '#d97c43';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(animateParticles);
      }

      // --- UI Illumination & State Sync ---
      function setMantraIllumination(activeTarget, triggerPulse = false) {
        if (activeTarget === 'pancha') {
          panchaTattvaBox.classList.add('mantra-illuminated');
          panchaTattvaBox.classList.remove('mantra-dimmed');
          mahamantraBox.classList.add('mantra-dimmed');
          mahamantraBox.classList.remove('mantra-illuminated');
          if (triggerPulse) {
            panchaTattvaBox.classList.remove('stanza-pulse');
            void panchaTattvaBox.offsetWidth;
            panchaTattvaBox.classList.add('stanza-pulse');
          }
        } else {
          mahamantraBox.classList.add('mantra-illuminated');
          mahamantraBox.classList.remove('mantra-dimmed');
          panchaTattvaBox.classList.add('mantra-dimmed');
          panchaTattvaBox.classList.remove('mantra-illuminated');
          if (triggerPulse) {
            mahamantraBox.classList.remove('stanza-pulse');
            void mahamantraBox.offsetWidth;
            mahamantraBox.classList.add('stanza-pulse');
          }
        }
      }

      function updateBeadHaloUI() {
        beadCountEl.textContent = currentBead;
        if (malaRoundNum) malaRoundNum.textContent = completedMalas;
        if (headerProgressText) headerProgressText.textContent = `${currentBead}/108`;

        // Stage whisper
        if (stageWhisperEl) {
          if (currentBead === 0) {
            stageWhisperEl.textContent = completedMalas > 0 ? `Mala ${completedMalas} Done` : '';
            setMantraIllumination('pancha', false);
          } else if (currentBead === 108) {
            stageWhisperEl.textContent = `Purna · Mala ${completedMalas + 1} Done`;
            setMantraIllumination('mahamantra', false);
          } else {
            stageWhisperEl.textContent = completedMalas > 0 ? `Mala ${completedMalas + 1} · Bead ${currentBead}` : `Bead ${currentBead}`;
            setMantraIllumination('mahamantra', false);
          }
        }

        // Update 108 perimeter beads
        for (let i = 0; i < TOTAL_BEADS; i++) {
          const item = beadElements[i];
          const beadIndex = i + 1;
          if (beadIndex < currentBead) {
            item.el.setAttribute('fill', '#c8a96e');
            item.el.setAttribute('r', item.isQuarter ? '2.5' : '1.8');
          } else if (beadIndex === currentBead) {
            item.el.setAttribute('fill', '#f4ece1');
            item.el.setAttribute('r', '3.1');
          } else {
            item.el.setAttribute(
              'fill',
              item.isQuarter ? 'rgba(200, 169, 110, 0.42)' : 'rgba(200, 169, 110, 0.18)'
            );
            item.el.setAttribute('r', item.isQuarter ? '2.4' : '1.4');
          }
        }

        saveState();
      }

      function createRipple() {
        const ring = document.createElement('div');
        ring.className = 'ripple-ring';
        rippleContainer.appendChild(ring);
        setTimeout(() => {
          ring.remove();
        }, 1100);
      }

      // --- Increment Chanting Counter ---
      function incrementChant(clientX, clientY) {
        keepScreenAwake();

        if (currentBead >= TOTAL_BEADS) {
          currentBead = 0;
        } else {
          currentBead += 1;
        }

        const isMalaDone = currentBead === TOTAL_BEADS;
        if (isMalaDone) {
          completedMalas += 1;
        }

        const isQuarter = currentBead === 27 || currentBead === 54 || currentBead === 81;

        // Tactile press animation
        counterAltar.classList.add('pressed');
        setTimeout(() => counterAltar.classList.remove('pressed'), 180);

        // Update UI & pulse the active Mahamantra stanza
        updateBeadHaloUI();
        if (currentBead > 0) {
          setMantraIllumination('mahamantra', true);
        }

        // Expanding golden ripple wave
        createRipple();

        // Spawn golden diya sparks
        const altarRect = counterAltar.getBoundingClientRect();
        const x = clientX ? clientX : (altarRect.left + altarRect.width / 2);
        const y = clientY ? clientY : (altarRect.top + altarRect.height / 2);
        spawnDiyaParticles(x, y, isMalaDone ? 24 : 9);

        // Haptic feedback
        if (isMalaDone) {
          triggerHaptic('sumeru');
        } else if (isQuarter) {
          triggerHaptic('quarter');
        } else {
          triggerHaptic('bead');
        }

        // Tulsi bead sound
        playTulsiBeadSound(isMalaDone);
      }

      // --- Undo Previous Bead ---
      function undoChant() {
        if (currentBead > 0) {
          currentBead -= 1;
        } else if (completedMalas > 0) {
          completedMalas -= 1;
          currentBead = TOTAL_BEADS - 1;
        } else {
          return;
        }

        counterAltar.classList.add('pressed');
        setTimeout(() => counterAltar.classList.remove('pressed'), 150);

        updateBeadHaloUI();
        triggerHaptic('undo');
        playTulsiBeadSound(false);

        const rect = undoBtn.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 6);
      }

      // --- Event Listeners with Mobile Touch Optimizations ---
      // Primary altar click/tap
      altarTouchWrapper.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        incrementChant(e.clientX, e.clientY);
      });

      // Undo button
      undoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        undoChant();
      });

      // Keyboard accessibility (Space / Enter / Backspace)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          if (document.activeElement !== panchaTattvaBox && document.activeElement !== mahamantraBox) {
            e.preventDefault();
            incrementChant();
          }
        } else if (e.code === 'Backspace') {
          e.preventDefault();
          undoChant();
        }
      });

      // Interactive Mantra Focus
      panchaTattvaBox.addEventListener('click', () => {
        keepScreenAwake();
        setMantraIllumination('pancha', true);
        const rect = panchaTattvaBox.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 7);
        triggerHaptic('bead');
        playTulsiBeadSound(false);
      });

      mahamantraBox.addEventListener('click', () => {
        keepScreenAwake();
        setMantraIllumination('mahamantra', true);
        const rect = mahamantraBox.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 7);
        triggerHaptic('bead');
        playTulsiBeadSound(false);
      });

      // Reset Button (Instant reset of current round or all)
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentBead > 0) {
          currentBead = 0;
        } else if (completedMalas > 0) {
          completedMalas = 0;
        }
        updateBeadHaloUI();
        createRipple();
        triggerHaptic('undo');
        playTulsiBeadSound(false);
        const rect = resetBtn.getBoundingClientRect();
        spawnDiyaParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
      });

      // Sound Toggle
      function syncSoundUI() {
        if (soundEnabled) {
          soundIconOn.classList.remove('hidden');
          soundIconOff.classList.add('hidden');
        } else {
          soundIconOn.classList.add('hidden');
          soundIconOff.classList.remove('hidden');
        }
      }

      soundToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        syncSoundUI();
        saveState();
        if (soundEnabled) {
          playTulsiBeadSound(false);
        }
        triggerHaptic('bead');
      });

      // Haptic Toggle
      function syncHapticUI() {
        if (hapticEnabled) {
          hapticIconOn.classList.remove('hidden');
          hapticIconOff.classList.add('hidden');
        } else {
          hapticIconOn.classList.add('hidden');
          hapticIconOff.classList.remove('hidden');
        }
      }

      hapticToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        hapticEnabled = !hapticEnabled;
        syncHapticUI();
        saveState();
        if (hapticEnabled) {
          triggerHaptic('bead');
        }
      });

      // Fullscreen Toggle (Hidden if unsupported e.g. iOS Safari)
      const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
      if (!canFullscreen && fullscreenToggle) {
        fullscreenToggle.style.display = 'none';
      } else if (fullscreenToggle) {
        fullscreenToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          triggerHaptic('bead');
          if (!document.fullscreenElement) {
            const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
            if (req) {
              req.call(document.documentElement).catch(() => {});
            }
            fullscreenIconEnter.classList.add('hidden');
            fullscreenIconExit.classList.remove('hidden');
          } else {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) {
              exit.call(document).catch(() => {});
            }
            fullscreenIconEnter.classList.remove('hidden');
            fullscreenIconExit.classList.add('hidden');
          }
        });

        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement) {
            fullscreenIconEnter.classList.remove('hidden');
            fullscreenIconExit.classList.add('hidden');
          } else {
            fullscreenIconEnter.classList.add('hidden');
            fullscreenIconExit.classList.remove('hidden');
          }
          resizeCanvas();
        });
      }

      // Initial UI Sync on window load
      window.addEventListener('DOMContentLoaded', () => {
        syncSoundUI();
        syncHapticUI();
        resizeCanvas();
        updateBeadHaloUI();
        animateParticles();
      });

      window.onload = function () {
        syncSoundUI();
        syncHapticUI();
        resizeCanvas();
        updateBeadHaloUI();
        animateParticles();
      };
    })();
  </script>
</body>

</html>
